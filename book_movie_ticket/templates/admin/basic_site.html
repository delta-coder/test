{% extends "admin/base.html" %}

{% block title %}
Quản trị Cinema Booking
{% endblock %}

{% block branding %}
<div style="display: flex; align-items: center; gap: 15px;">

    <h1 id="site-name" style="margin: 0;">
        <a href="{% url 'admin:index' %}">
            Quản trị Cinema Booking
        </a>
    </h1>

    <button onclick="goBackAdmin()"
            style="
                padding: 7px 12px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            ">
        ← Quay lại
    </button>

    <a href="/"
       style="
           padding: 7px 12px;
           background: #417690;
           color: white;
           border-radius: 5px;
           text-decoration: none;
       ">
        🏠 Về trang web
    </a>

</div>
{% endblock %}


{% block nav-global %}

<script>
function goBackAdmin() {
    if (document.referrer) {
        history.back();
    } else {
        window.location.href = "/";
    }
}

/*
Ctrl + Alt + H
→ về trang chủ
*/
document.addEventListener("keydown", function(event) {

    if (
        event.ctrlKey &&
        event.altKey &&
        event.key.toLowerCase() === "h"
    ) {
        event.preventDefault();
        window.location.href = "/";
    }

});
</script>

{% endblock %}
